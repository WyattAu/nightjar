name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      - name: build (tsc + vite)
        run: bun run build
      - name: cargo check (tauri rust, dsp-core pin)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev libssl-dev libevdev-dev cmake clang libclang-dev
          # ggml vulkan backend needs SPIRV-Headers + glslc; ubuntu's
          # spirv-headers package provides the cmake config
          sudo apt-get install -y spirv-headers glslang-tools libvulkan-dev
          cd src-tauri
          cargo check
